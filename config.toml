# Ezra の設定。秘密情報（トークン）はここに書かず、環境変数で渡す（deploy/README.md を参照）。

# テーマごとの作業用ディレクトリを置く場所。sandbox は一時フォルダへの書き込みを許すので、/tmp などの下には置かない
research_root = "~/research"
# SQLite などBotの状態を置く場所
state_dir = "~/.local/state/ezra"

# claude -p を同時に動かす上限（違うスレッドどうし）
max_concurrent_runs = 2
# claude -p 1回の上限時間。長い作業はジョブにする
run_timeout_minutes = 30
# ジョブの状態を確認する間隔
job_poll_seconds = 60
# pueue の ezra グループで同時に走らせるジョブ数
job_parallel = 1
# 空なら Claude Code の既定のモデル
model = ""

[schedule]
# 決まった時刻の処理（ローカル時刻）。空文字 "" にすると、その処理を行わない
enabled = true
literature = "07:00"  # 先行研究の新着（テーマごと）
daily = "08:00"       # Daily（#research-overview）
review = "21:00"      # 振り返りの材料（#research-overview）
night = "01:30"       # 🌙 をつけた Task
# Mac のスリープなどで逃した処理を、何時間後まで実行するか
catch_up_hours = 3
night_max_tasks = 5
# この日数やり取りのないテーマを Daily で触れる
stall_days = 3
# 失敗したジョブや確認待ちを、この時間放置したら声をかける
unanswered_hours = 24

[maintenance]
# 毎晩の保守。古いファイルを整理してから、~/research を非公開の Git リポジトリに push する
enabled = true
time = "22:00"
backup = true
digest_retention_days = 30
session_retention_days = 90

[channels]
# 研究全体・中長期の方針: すべてのテーマを読むだけ。書き込みは _overview/ だけ
overview = ["research-overview", "research-strategy"]
# Ezra の改善: 要望を ~/research/_overview/backlog.md に記録するだけ
improve = ["research-ezra"]
# 上記以外で Ezra を招待したチャンネルは、研究テーマとして扱う（#vlm-counting → ~/research/vlm-counting/）
# 個人用のチャンネルには Ezra を招待しない

[sandbox]
# Bash（sandbox内）から接続してよいドメイン
allowed_domains = [
  "export.arxiv.org",
  "arxiv.org",
  "api.semanticscholar.org",
  "pypi.org",
  "files.pythonhosted.org",
]
# 作業用ディレクトリ以外で、Bash が書き込んでよい場所（uv のキャッシュなど）
allow_write = ["~/.cache/uv"]
