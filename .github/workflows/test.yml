name: テスト

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # この仕組みは JST の Mac で動く。UTC で走らせると、Moodle の締切（UTC で書き出される）を
      # 手元の時刻に直すところが9時間ずれて落ちる
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 依存関係を入れる
        # 束ねを全部入れる。既定だけだと a2a が無く、テストの収集で落ちる
        run: uv sync --frozen --all-groups
      - name: 書き方を確かめる
        run: uvx ruff check .
      - name: テストを実行する
        # tests/ の中に、kei-agent module new の4種類のひな形を作って、そのテストを通すものもある
        run: uv run python -m pytest
      - name: モジュールのテストを実行する
        # テストを自分のフォルダ（modules/<名前>/tests/）に持つ組み込みのモジュールは、作る人と同じ柵を付けて動かす
        run: |
          for tests in modules/*/tests; do
            if [ -d "$tests" ]; then
              uv run kei-agent module test "$(basename "$(dirname "$tests")")"
            fi
          done
