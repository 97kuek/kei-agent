name: テスト

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 依存関係を入れる
        # 束ねを全部入れる。既定だけだと a2a が無く、テストの収集で落ちる
        run: uv sync --frozen --all-groups
      - name: 書き方を確かめる
        run: uvx ruff check .
      - name: テストを実行する
        run: uv run python -m pytest
