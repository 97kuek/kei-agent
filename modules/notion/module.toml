# Mac の Notion ゲートウェイ（docs/architecture.md の「Notion」）。
api = 2
name = "notion"
label = "Notion"
description = "Mac の Notion ゲートウェイ。使う側ごとに、agents.csv の notion の列に書いたホームの下だけを通す"

# 常駐のプロセス（A2A ではない。MCP サーバーと /notion/v1 API）。Mac の Notion の鍵（NOTION_TOKEN）を持てるのは、このプロセスだけ。
# ホームのページ ID は agents.csv の notion の列（本体が読んで、ゲートウェイに渡す）
[process]
port = 8791
kind = "service"

# 秘密情報（値はここに書かない。kei-agent setup が聞いて秘密情報のファイルに書き、kei-agent doctor が有無を確かめる）。
# NOTION_TOKEN は共通のファイルに置くが、起動スクリプトがこのプロセス以外では消す
[secrets]
NOTION_TOKEN = { description = "Notion のコネクト「Kei Agent」のアクセストークン（ntn_ で始まる）", required = true }
KEI_AGENT_NOTION_GATEWAY_TOKEN = { description = "ゲートウェイの親の合言葉。ここから、使う側ごとの合言葉を作る", required = true, generate = true }
