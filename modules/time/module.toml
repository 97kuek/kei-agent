# 時間記録のモジュール（docs/extensibility.md）。MCP の timer で人の時間を測り、Toggl と共通ホームに送る
api = 2
name = "time"
label = "時間記録"
description = "MCP の timer で時間を測り、Toggl と共通ホームの「時間記録」に送る。Toggl で直接測った記録も取り込む"

# 定期処理（時刻とオンオフは schedules.csv で変えられる。default は書いていないときの時刻）
[schedules.toggl_import]
label = "Toggl の取り込み"
default = "22:00"

# 秘密情報（値はここに書かない。kei-agent setup が聞き、kei-agent doctor が有無を確かめる）。
# 3つそろわなければ Toggl には送らず、時間は共通ホームの「時間記録」にだけ書く
[secrets]
TOGGL_API_TOKEN = { description = "Toggl の API トークン（Toggl の Profile → API Token）", group = "Toggl" }
TOGGL_ORGANIZATION_ID = { description = "Toggl の組織の ID（focus.toggl.com/<組織>/workspaces/<ワークスペース>/ の URL から）", group = "Toggl" }
TOGGL_WORKSPACE_ID = { description = "Toggl のワークスペースの ID（同じ URL から）", group = "Toggl" }
