# 大学のモジュール（docs/extensibility.md）。Moodle の課題、Notion の授業と課題、Toggl の実績
api = 2
name = "course"
label = "大学"
description = "Moodle の課題と提出・受験状態を授業ホームに同期し、授業・課題・実績の機械的な読み取りを提供する"

# 担当プロセス（A2A のサーバー）。秘密情報は kei-agent-course.zsh（Moodle の ICS と任意の API）
[process]
port = 8787

# チャンネル（番号を外した名前。agents.csv の course の行の channels で変えられる）
[channels]
course = ["course"]

# 設定（config.toml の [course] で変えられる。学校ごとの違いの書き方は school.py）
[settings]
# 学校の部品（時限の時刻・学期の既定と、成績の取り込み方）。同梱は "waseda"（早稲田大学）。
# 自分で書いた部品は、そのファイルの場所（~ から、または利用者のフォルダからの相対）
school = ""
# 時限の時刻（1 = "08:50-10:30" の表）。書かなければ学校の部品の既定
periods = {}
# 学期と、開かれる月（"春学期" = [4, 5, 6, 7, 8] の表）。書かなければ学校の部品の既定
terms = {}

# 秘密情報（値はここに書かない。kei-agent setup が聞き、kei-agent doctor が有無を確かめる）
[secrets]
MOODLE_ICS_URL = { description = "Moodle のカレンダーの書き出し URL（課題の締切を取り込む）", own_file = true }
MOODLE_API_URL = { description = "HTTPS の Moodle ルート URL（提出・受験終了を確認する任意の連携）", own_file = true, group = "Moodle API" }
MOODLE_API_TOKEN = { description = "本人の Moodle API トークン（提出・受験状態を読む関数が利用可能なもの）", own_file = true, group = "Moodle API" }
