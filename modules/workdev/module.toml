# 仕事の開発のモジュール（docs/agents/workdev-agent.md）。仕事のプロジェクトのチャンネルで、作業場のコードを書いて動かす
api = 1
name = "workdev"
label = "仕事の開発"
description = "仕事のプロジェクトのチャンネル（#work-<名前>）で、作業場（~/work/<名前>）のコードを書き、コマンドとテストを動かす"

# AI の実行役（provider は agents.csv の engine）。会社のアカウントは agents.csv の claude_account・codex_account。
# 研究テーマと同じく、作業場の中だけを書き、コマンドも Web も使う。Outlook・Teams などの連携と Notion は持たない
# （メールなどの外の文と、コマンド・Web の外へ出す口を、1回の実行に揃えないため）
[actor]
# 会社のデータを読む。外へ出られない（Web もコマンドの通信も無し）
data = "company"
prompt = "workdev.md"
notion = "none"
# プロジェクトの作業場を置く場所（agents.csv の workdev の行の folder で変えられる）
workspace = "~/work"
default_use_case = "workdev_execute"
# 頭（Dots など）が伝える重さ → 用途
weights = { light = "workdev_execute", normal = "workdev_execute", deep = "workdev_design" }
classify = "実装・修正・テスト・調査は workdev_execute、設計・方針の比較・大きな作り替えの計画は workdev_design。"

[use_cases.workdev_execute]
claude = { model = "claude-sonnet-5", effort = "high" }
codex = { model = "gpt-6-sol", effort = "high" }

[use_cases.workdev_design]
claude = { model = "claude-opus-5", effort = "high" }
codex = { model = "gpt-6-sol", effort = "xhigh" }

# 担当プロセス（A2A のサーバー）
[process]
port = 8793

# 頭が work- のチャンネル（番号を外した名前）。#work-billing の作業場は ~/work/billing
[channels]
project = ["work-*"]
