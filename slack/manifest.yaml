# Slack App「Ezra」のマニフェスト。https://api.slack.com/apps → Create New App → From a manifest で貼り付ける
display_information:
  name: Ezra
  description: 研究室の助手。依頼された作業を進めて、経過と結果をスレッドに返す
  background_color: "#2c3e50"
features:
  bot_user:
    display_name: Ezra
    always_online: true
  # AI アプリとして扱う。作業中のステータス（agents.sessions.setStatus）と、
  # 返事を流しながら見せる表示（chat.startStream）に必要
  agent_view:
    agent_description: 研究の作業を進めて、経過と結果をスレッドに返す
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - chat:write
      - files:read
      - files:write
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - member_joined_channel
      - channel_rename
      - group_rename
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
