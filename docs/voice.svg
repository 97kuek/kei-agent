<text x="44" y="332" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#697683" text-anchor="start">時刻・今日の予定・次の授業・締切・Kei Agent の様子。</text>
