<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-label="Kei Agent が自分を直す流れ">
  <defs>
    <marker id="a" viewBox="0 0 8 6.4" refX="7.4" refY="3.2" markerWidth="7" markerHeight="5.6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#A6AEB8"/>
    </marker>
    <marker id="stop" viewBox="0 0 8 6.4" refX="7.4" refY="3.2" markerWidth="7" markerHeight="5.6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 3.2 L 0 6.4 z" fill="#D97757"/>
    </marker>
    <style>
      .t { font-family: 'Hiragino Sans','Noto Sans JP','Yu Gothic','Helvetica Neue',Arial,sans-serif; fill: #1B1F24; }
      .s { font-family: 'Hiragino Sans','Noto Sans JP','Yu Gothic','Helvetica Neue',Arial,sans-serif; fill: #697683; font-size: 11.5px; }
      .m { font-family: 'SFMono-Regular','SF Mono',Menlo,Consolas,monospace; fill: #55606C; font-size: 11px; }
      .box { fill: #FFFFFF; stroke: #E2E5E9; stroke-width: 1.2; }
      .lane { fill: #F6F7F9; stroke: #E2E5E9; stroke-width: 1.2; }
      .edge { fill: none; stroke: #A6AEB8; stroke-width: 1.6; stroke-linecap: round; marker-end: url(#a); }
      .guard { fill: none; stroke: #D97757; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 5 5; marker-end: url(#stop); }
    </style>
  </defs>
  <rect width="1180" height="620" fill="#FFFFFF"/>
  <text class="t" x="40" y="46" font-size="23" font-weight="600">Kei Agent が自分を直す流れ（#research-agent）</text>
  <text class="s" x="40" y="70">人が決めるのは「この直し方でいい？」と「このコードを取り込んでいい？」の2つだけ</text>

  <rect class="lane" x="40" y="96" width="1100" height="120" rx="14"/>
  <text class="s" x="58" y="120">Slack のスレッド（依頼者と Kei Agent のやりとり）</text>
  <rect class="box" x="60" y="132" width="180" height="64" rx="10"/>
  <text class="t" x="150" y="158" font-size="13" font-weight="600" text-anchor="middle">要望を書く</text>
  <text class="s" x="150" y="178" text-anchor="middle">backlog.md にも記録</text>
  <rect class="box" x="290" y="132" width="180" height="64" rx="10"/>
  <text class="t" x="380" y="158" font-size="13" font-weight="600" text-anchor="middle">Kei Agent が案を返す</text>
  <text class="s" x="380" y="178" text-anchor="middle">コードは読むだけ</text>
  <rect class="box" x="520" y="132" width="180" height="64" rx="10"/>
  <text class="t" x="610" y="152" font-size="13" font-weight="600" text-anchor="middle">いいよ → 確認</text>
  <text class="s" x="610" y="172" text-anchor="middle">「これで進めていい？」</text>
  <text class="s" x="610" y="188" text-anchor="middle">もう一度いいよ</text>
  <rect class="box" x="750" y="132" width="180" height="64" rx="10"/>
  <text class="m" x="840" y="156" text-anchor="middle">🛠 着手</text>
  <text class="s" x="840" y="176" text-anchor="middle">依頼者の投稿の回だけ有効</text>
  <rect class="box" x="960" y="132" width="160" height="64" rx="10"/>
  <text class="t" x="1040" y="152" font-size="13" font-weight="600" text-anchor="middle">差分を見て</text>
  <text class="m" x="1040" y="174" text-anchor="middle">📦 取り込み</text>
  <path class="edge" d="M 240 164 L 286 164"/>
  <path class="edge" d="M 470 164 L 516 164"/>
  <path class="edge" d="M 700 164 L 746 164"/>
  <path class="edge" d="M 930 164 L 956 164"/>

  <rect class="lane" x="40" y="250" width="700" height="150" rx="14"/>
  <text class="s" x="58" y="274">手元の worktree（動いている Kei Agent には触れない）</text>
  <rect class="box" x="60" y="286" width="200" height="96" rx="10"/>
  <text class="t" x="160" y="312" font-size="13" font-weight="600" text-anchor="middle">Claude が直す</text>
  <text class="s" x="160" y="332" text-anchor="middle">落ちるテストを先に書く</text>
  <text class="s" x="160" y="350" text-anchor="middle">書けるのは worktree の中だけ</text>
  <text class="s" x="160" y="368" text-anchor="middle">通信先は PyPI など基本の接続先</text>
  <rect class="box" x="300" y="286" width="200" height="96" rx="10"/>
  <text class="t" x="400" y="312" font-size="13" font-weight="600" text-anchor="middle">Kei Agent がまとめる</text>
  <text class="s" x="400" y="332" text-anchor="middle">コミットして差分を作る</text>
  <text class="s" x="400" y="350" text-anchor="middle">柵・秘密情報・大きさを確認</text>
  <text class="s" x="400" y="368" text-anchor="middle">依存の変更は先頭に出す</text>
  <rect class="box" x="540" y="286" width="180" height="96" rx="10"/>
  <text class="t" x="630" y="322" font-size="13" font-weight="600" text-anchor="middle">取り込む前に</text>
  <text class="s" x="630" y="342" text-anchor="middle">テストと ruff を</text>
  <text class="s" x="630" y="360" text-anchor="middle">sandbox の外で回す</text>
  <path class="edge" d="M 840 200 L 840 230 L 170 230 L 170 282"/>
  <path class="edge" d="M 260 334 L 296 334"/>
  <path class="edge" d="M 500 334 L 536 334"/>
  <path class="edge" d="M 400 386 L 400 420 L 1040 420 L 1040 200"/>
  <text class="s" x="700" y="414" text-anchor="middle">変えた内容と change.diff をスレッドに出して「取り込んでいい？」</text>

  <rect class="lane" x="790" y="250" width="350" height="150" rx="14"/>
  <text class="s" x="808" y="274">取り込んだあと</text>
  <rect class="box" x="810" y="286" width="140" height="96" rx="10"/>
  <text class="t" x="880" y="318" font-size="13" font-weight="600" text-anchor="middle">main に入れて</text>
  <text class="t" x="880" y="338" font-size="13" font-weight="600" text-anchor="middle">GitHub に push</text>
  <text class="s" x="880" y="360" text-anchor="middle">早送りのみ</text>
  <rect class="box" x="980" y="286" width="140" height="96" rx="10"/>
  <text class="t" x="1050" y="318" font-size="13" font-weight="600" text-anchor="middle">作業が終わったら</text>
  <text class="t" x="1050" y="338" font-size="13" font-weight="600" text-anchor="middle">自分で入れ替わる</text>
  <text class="s" x="1050" y="360" text-anchor="middle">launchd が起動し直す</text>
  <path class="edge" d="M 950 334 L 976 334"/>
  <path class="edge" d="M 720 334 L 806 334"/>

  <rect class="lane" x="40" y="440" width="1100" height="150" rx="14"/>
  <text class="s" x="58" y="464">止まる・戻すところ</text>
  <rect class="box" x="60" y="478" width="250" height="92" rx="10"/>
  <text class="t" x="185" y="504" font-size="13" font-weight="600" text-anchor="middle">柵に触れた差分</text>
  <text class="m" x="185" y="526" text-anchor="middle">guard.py / config.toml / deploy/</text>
  <text class="s" x="185" y="548" text-anchor="middle">中身を見る前に捨てる</text>
  <rect class="box" x="340" y="478" width="250" height="92" rx="10"/>
  <text class="t" x="465" y="504" font-size="13" font-weight="600" text-anchor="middle">手元に書きかけがある</text>
  <text class="s" x="465" y="526" text-anchor="middle">コミットしていない変更があれば</text>
  <text class="s" x="465" y="546" text-anchor="middle">取り込まずに知らせる</text>
  <rect class="box" x="620" y="478" width="250" height="92" rx="10"/>
  <text class="t" x="745" y="504" font-size="13" font-weight="600" text-anchor="middle">main が先に進んだ</text>
  <text class="s" x="745" y="526" text-anchor="middle">worktree で乗せ直して</text>
  <text class="s" x="745" y="546" text-anchor="middle">もう一度聞く</text>
  <rect class="box" x="900" y="478" width="220" height="92" rx="10"/>
  <text class="t" x="1010" y="504" font-size="13" font-weight="600" text-anchor="middle">新しい版が起動しない</text>
  <text class="s" x="1010" y="526" text-anchor="middle">3回で run.sh が revert し</text>
  <text class="s" x="1010" y="546" text-anchor="middle">前の版に戻して知らせる</text>
  <path class="guard" d="M 360 386 L 360 440 L 185 440 L 185 474"/>
  <path class="guard" d="M 600 386 L 600 440 L 465 440 L 465 474"/>
  <path class="guard" d="M 660 386 L 660 440 L 745 440 L 745 474"/>
  <path class="guard" d="M 1080 386 L 1080 440 L 1010 440 L 1010 474"/>
</svg>
