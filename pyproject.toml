[project]
name = "kei-agent"
version = "0.1.0"
description = "Kei Agent: Slack から頼んだ用事を、担当のエージェント（研究・大学・仕事）に振り分けて進めるアシスタント"
authors = [
    { name = "97kuek", email = "keitaro.ueki@icloud.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # 声のモジュール（modules/voice）は Realtime API の WebSocket を aiohttp で直に叩く
    "aiohttp>=3.14.3",
    # Notion のモジュール（modules/notion）のゲートウェイの MCP の口
    "mcp>=2,<3",
    "slack-bolt>=1.30.0",
]

[project.scripts]
# 何も付けなければ Kei Agent を動かす。kei-agent doctor で点検（kei_agent/cli.py）
kei-agent = "kei_agent.operations.cli:main"
kei-agent-schedule = "kei_agent.scheduling.schedule:main"
kei-agent-notion-setup = "kei_agent.storage.notion:main"
kei-agent-hub-setup = "kei_agent.storage.notion_hub:main"
kei-agent-ask = "kei_agent.conversation.ask:main"
# モジュールの担当プロセス（modules/<名前>/agent.py）を起動する共通のコマンド。例: kei-agent-module knowledge
kei-agent-module = "kei_agent_a2a.launch:main"

[tool.uv.build-backend]
# A2A の担当の土台（src/kei_agent_a2a）は、Kei Agent 本体とは別のパッケージにしてある（依存を閉じる）。
# 機能はモジュールとして modules/ に置き、ここには書かない
module-name = ["kei_agent", "kei_agent_a2a"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# A2A のサーバー側（モジュールの担当プロセス）に必要なもの
agents = [
    "a2a-sdk[http-server]>=1.1.4",
    "uvicorn>=0.53.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# 押さえたいのは「壊れている・読みにくい」ところ。時刻は端末のローカル時刻で扱う方針なので DTZ は外す
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF100"]
# ASYNC240/ASYNC109: 小さなファイル操作と、上限時間を渡す関数は、このBotでは素直に書く
ignore = ["E501", "ASYNC240", "ASYNC109"]

[tool.ruff.lint.isort]
# モジュールのフォルダ（modules/<名前>/）は、起動のときに kei_agent_modules.<名前> として読む（kei_agent.framework.modules.package）
known-first-party = ["kei_agent_modules"]
