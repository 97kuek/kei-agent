[project]
name = "ezra"
version = "0.1.0"
description = "Ezra: Slack から Claude Code に研究作業を頼むアシスタント"
authors = [
    { name = "97kuek", email = "keitaro.ueki@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "slack-bolt>=1.30.0",
]

[project.scripts]
ezra = "ezra.app:main"
ezra-schedule = "ezra.schedule:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
