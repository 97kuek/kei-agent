[project]
name = "ezra"
version = "0.1.0"
description = "Ezra: Slack から Claude Code に研究作業を頼むアシスタント"
authors = [
    { name = "97kuek", email = "keitaro.ueki@icloud.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp>=3.14.3",
    "slack-bolt>=1.30.0",
]

[project.scripts]
ezra = "ezra.app:main"
ezra-schedule = "ezra.schedule:main"
ezra-notion-setup = "ezra.notion:main"
ezra-ask = "ezra.ask:main"
ezra-voice = "ezra_voice.app:main"

[tool.uv.build-backend]
# 机の上の音声対話（src/ezra_voice）は、Ezra 本体とは別のパッケージにしてある
module-name = ["ezra", "ezra_voice"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# 押さえたいのは「壊れている・読みにくい」ところ。時刻は端末のローカル時刻で扱う方針なので DTZ は外す
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF100"]
# ASYNC240/ASYNC109: 小さなファイル操作と、上限時間を渡す関数は、このBotでは素直に書く
ignore = ["E501", "ASYNC240", "ASYNC109"]
